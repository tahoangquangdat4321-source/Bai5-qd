<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
</head>
<body>
    <div class="app-container">
        <aside class="app-tool">
            <ul>
                <li class="tool-tip">
                    <a href="#"><img src="/icon.svg/element-4.svg"></a>
                </li>
                <li class="tool-tip">
                    <a href="#"><img src="/icon.svg/graph.svg"></a>
                </li>
                <li class="tool-tip">
                    <a href="#"><img src="/icon.svg/medal-star.svg"></a>
                </li>
                <li class="tool-tip">
                    <a href="#"><img src="/icon.svg/messages.svg"></a>
                </li>
                <li class="tool-tip">
                    <a href="#"><img src="/icon.svg/setting-2.svg"></a>
                </li>
            </ul>
        </aside>
        <main>
            <header class="main-content">
                <div class="welcome-text">
                    <h1><b>Welcome, Amada</b></h1>
                    <p class="date-text">Tue, 07 June 2022</p>
                </div>
                <div class="header-right">
                    <div class="search-title">
                        <img src="./icon.svg/search-normal.svg" alt="icon">
                        <input type="text" placeholder="Search">
                    </div>
                    <img src="./icon.svg/notification-bing.svg" class="bell">
                    <img src="./icon.svg/Rectangle 1072.svg" alt="User" class="avatar-img">
                </div>
            </header>
            <section class="card">
                    <div class="banner"></div>
                    <div class="profile-info">
                        <div class="info-left">
                            <img src="./icon.svg/Ellipse 11.svg" alt="Alexa" class="avatar-large">
                            <div>
                                <h2>Alexa Rawles</h2>
                                <p>alexarawles@gmail.com</p>
                            </div>
                        </div>
                        <button class="btn-edit">Edit</button>
                    </div>
                    <form class="profile-form">
                        <div class="form-group"><label>Full Name</label><input type="text" placeholder="Your First Name"></div>
                        <div class="form-group"><label>Nick name</label><input type="text" placeholder="Your Nick Name"></div>
                        <div class="form-group"><label>Gender</label><select><option>Your Gender</option></select></div>
                        <div class="form-group"><label>Country</label><select><option>Your Country</option></select></div>
                        <div class="form-group"><label>Language</label><select><option>Your Language</option></select></div>
                        <div class="form-group"><label>Time Zone</label><select><option>Your Time Zone</option></select></div>
                    </form>
                    <div class="email-section">
                        <h3 class="email-title">My email Address</h3>
                        <div class="email-info-box9">
                            <div class="icon-circle">
                                <img src="./icon.svg/sms.svg" alt="Mail Icon"> 
                            </div>
                            <div class="email-text">
                                <p class="email-address">alexarawles@gmail.com</p>
                                <p class="email-date">1 month ago</p>
                            </div>
                        </div>
                        <button class="add-email-btn">+Add Email Address</button>
                    </div>
            </section>
        </main>
    </div>
</body>
</html>
